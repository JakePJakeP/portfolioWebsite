<svg viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duquesne Incline website mockup">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1410"/><stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="d-hero" x1="30" y1="40" x2="200" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" stop-opacity="0.2"/><stop offset="1" stop-color="#451a03" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="d-sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e3a5f" stop-opacity="0.6"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="d-shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="d-glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="url(#d-bg)"/>
  <!-- desktop site -->
  <rect x="20" y="18" width="188" height="164" rx="6" fill="#0f0a08" stroke="rgba(245,158,11,0.4)" stroke-width="1.2" filter="url(#d-shadow)"/>
  <rect x="20" y="18" width="188" height="16" rx="6" fill="rgba(245,158,11,0.12)"/>
  <circle cx="30" cy="26" r="2.5" fill="#ff5f57"/><circle cx="38" cy="26" r="2.5" fill="#febc2e"/><circle cx="46" cy="26" r="2.5" fill="#28c840"/>
  <!-- nav -->
  <text x="30" y="42" fill="rgba(245,158,11,0.85)" font-size="5.5" font-weight="700" font-family="system-ui,serif">Duquesne Incline</text>
  <rect x="150" y="34" width="16" height="3" rx="1" fill="rgba(255,255,255,0.15)"/>
  <rect x="170" y="34" width="16" height="3" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="190" y="32" width="12" height="7" rx="3" fill="rgba(245,158,11,0.35)"/>
  <!-- hero with incline -->
  <rect x="28" y="48" width="172" height="56" rx="3" fill="url(#d-hero)"/>
  <rect x="28" y="48" width="172" height="56" rx="3" fill="url(#d-sky)" opacity="0.5"/>
  <!-- Pittsburgh skyline silhouette -->
  <path d="M28 90 L50 72 L70 82 L90 65 L110 78 L130 60 L150 75 L170 68 L200 80 L200 104 L28 104 Z" fill="rgba(15,23,42,0.5)"/>
  <!-- incline car on tracks -->
  <line x1="140" y1="104" x2="155" y2="52" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <line x1="155" y1="52" x2="175" y2="48" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <rect x="148" y="58" width="18" height="14" rx="2" fill="rgba(245,158,11,0.25)" stroke="rgba(245,158,11,0.5)" filter="url(#d-glow)"/>
  <rect x="152" y="62" width="10" height="6" rx="1" fill="rgba(255,255,255,0.15)"/>
  <text x="36" y="68" fill="rgba(255,255,255,0.75)" font-size="6" font-weight="700" font-family="system-ui,serif">Historic Pittsburgh</text>
  <text x="36" y="78" fill="rgba(255,255,255,0.4)" font-size="4.5" font-family="system-ui,sans-serif">Ride the iconic cable car</text>
  <rect x="36" y="84" width="36" height="8" rx="4" fill="rgba(245,158,11,0.45)"/>
  <text x="42" y="90" fill="rgba(0,0,0,0.7)" font-size="4" font-weight="600" font-family="system-ui,sans-serif">Plan Visit</text>
  <!-- content cards -->
  <rect x="28" y="110" width="52" height="32" rx="3" fill="rgba(30,20,10,0.8)" stroke="rgba(245,158,11,0.2)"/>
  <text x="34" y="120" fill="rgba(245,158,11,0.7)" font-size="4" font-weight="600" font-family="ui-monospace,monospace">HOURS</text>
  <rect x="34" y="124" width="40" height="3" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="34" y="130" width="32" height="3" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="86" y="110" width="52" height="32" rx="3" fill="rgba(30,20,10,0.8)" stroke="rgba(245,158,11,0.2)"/>
  <text x="92" y="120" fill="rgba(245,158,11,0.7)" font-size="4" font-weight="600" font-family="ui-monospace,monospace">HISTORY</text>
  <rect x="92" y="124" width="40" height="3" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="92" y="130" width="36" height="3" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="144" y="110" width="52" height="32" rx="3" fill="rgba(30,20,10,0.8)" stroke="rgba(245,158,11,0.2)"/>
  <text x="150" y="120" fill="rgba(245,158,11,0.7)" font-size="4" font-weight="600" font-family="ui-monospace,monospace">GALLERY</text>
  <rect x="150" y="124" width="20" height="14" rx="2" fill="rgba(245,158,11,0.15)"/>
  <rect x="172" y="124" width="20" height="14" rx="2" fill="rgba(245,158,11,0.1)"/>
  <!-- mobile preview -->
  <rect x="222" y="32" width="78" height="140" rx="12" fill="#0a0806" stroke="rgba(245,158,11,0.45)" stroke-width="1.2" filter="url(#d-shadow)"/>
  <rect x="248" y="38" width="26" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="230" y="48" width="62" height="116" rx="4" fill="rgba(28,20,16,0.9)"/>
  <rect x="234" y="52" width="54" height="36" rx="2" fill="rgba(245,158,11,0.15)"/>
  <path d="M234 88 L260 70 L288 82 L288 88 Z" fill="rgba(15,23,42,0.4)"/>
  <rect x="248" y="74" width="12" height="8" rx="1" fill="rgba(245,158,11,0.3)" stroke="rgba(245,158,11,0.5)"/>
  <text x="238" y="100" fill="rgba(255,255,255,0.6)" font-size="4.5" font-weight="600" font-family="system-ui,serif">Duquesne</text>
  <text x="238" y="110" fill="rgba(255,255,255,0.35)" font-size="4" font-family="system-ui,sans-serif">Incline Info</text>
  <rect x="238" y="116" width="46" height="6" rx="3" fill="rgba(245,158,11,0.35)"/>
  <rect x="238" y="128" width="54" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="238" y="136" width="40" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="238" y="144" width="48" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
</svg>
