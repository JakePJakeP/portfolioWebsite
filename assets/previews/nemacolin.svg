<svg viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nemacolin IT Resource Dashboard mockup">
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="n-glow" x1="160" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.15"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="n-card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.9"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="n-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="n-glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="url(#n-bg)"/>
  <rect width="320" height="200" fill="url(#n-glow)"/>
  <!-- browser chrome -->
  <rect x="24" y="14" width="272" height="172" rx="8" fill="#0c1222" stroke="rgba(129,140,248,0.45)" stroke-width="1.2" filter="url(#n-shadow)"/>
  <rect x="24" y="14" width="272" height="20" rx="8" fill="rgba(99,102,241,0.18)"/>
  <circle cx="36" cy="24" r="3" fill="#ff5f57"/><circle cx="46" cy="24" r="3" fill="#febc2e"/><circle cx="56" cy="24" r="3" fill="#28c840"/>
  <text x="160" y="27" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="6" font-family="ui-monospace,monospace">IT Resource Dashboard</text>
  <!-- sidebar -->
  <rect x="32" y="38" width="44" height="140" rx="4" fill="rgba(15,23,42,0.85)" stroke="rgba(129,140,248,0.2)"/>
  <rect x="38" y="46" width="32" height="6" rx="2" fill="rgba(99,102,241,0.35)"/>
  <rect x="38" y="58" width="28" height="4" rx="1" fill="rgba(255,255,255,0.12)"/>
  <rect x="38" y="68" width="28" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="38" y="78" width="28" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="38" y="88" width="28" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="38" y="98" width="28" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <rect x="38" y="108" width="28" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="44" cy="130" r="3" fill="rgba(129,140,248,0.4)"/><circle cx="54" cy="130" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="64" cy="130" r="3" fill="rgba(255,255,255,0.1)"/>
  <!-- top bar -->
  <rect x="82" y="38" width="206" height="16" rx="3" fill="rgba(30,41,59,0.6)" stroke="rgba(129,140,248,0.15)"/>
  <rect x="88" y="42" width="52" height="8" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(129,140,248,0.2)"/>
  <text x="92" y="48" fill="rgba(255,255,255,0.25)" font-size="4.5" font-family="ui-monospace,monospace">Search assets...</text>
  <circle cx="276" cy="46" r="5" fill="rgba(99,102,241,0.3)" stroke="rgba(129,140,248,0.5)"/>
  <!-- stat cards -->
  <rect x="82" y="58" width="48" height="28" rx="3" fill="url(#n-card)" stroke="rgba(129,140,248,0.25)" filter="url(#n-glow-f)"/>
  <text x="88" y="68" fill="rgba(129,140,248,0.8)" font-size="4" font-family="ui-monospace,monospace">Assets</text>
  <text x="88" y="80" fill="rgba(255,255,255,0.7)" font-size="7" font-weight="bold" font-family="ui-monospace,monospace">248</text>
  <circle cx="122" cy="72" r="2" fill="#22c55e"/>
  <rect x="134" y="58" width="48" height="28" rx="3" fill="url(#n-card)" stroke="rgba(129,140,248,0.25)"/>
  <text x="140" y="68" fill="rgba(129,140,248,0.8)" font-size="4" font-family="ui-monospace,monospace">Tickets</text>
  <text x="140" y="80" fill="rgba(255,255,255,0.7)" font-size="7" font-weight="bold" font-family="ui-monospace,monospace">12</text>
  <rect x="186" y="58" width="48" height="28" rx="3" fill="url(#n-card)" stroke="rgba(129,140,248,0.25)"/>
  <text x="192" y="68" fill="rgba(129,140,248,0.8)" font-size="4" font-family="ui-monospace,monospace">Licenses</text>
  <text x="192" y="80" fill="rgba(255,255,255,0.7)" font-size="7" font-weight="bold" font-family="ui-monospace,monospace">89</text>
  <!-- mini chart -->
  <rect x="240" y="58" width="48" height="28" rx="3" fill="url(#n-card)" stroke="rgba(129,140,248,0.25)"/>
  <polyline points="246,80 252,74 258,76 264,68 270,72 276,64 282,66" stroke="rgba(129,140,248,0.7)" stroke-width="1.2" fill="none"/>
  <!-- asset table -->
  <rect x="82" y="90" width="124" height="88" rx="3" fill="rgba(15,23,42,0.7)" stroke="rgba(129,140,248,0.2)"/>
  <text x="88" y="100" fill="rgba(129,140,248,0.7)" font-size="4.5" font-weight="600" font-family="ui-monospace,monospace">ASSET INVENTORY</text>
  <line x1="88" y1="104" x2="200" y2="104" stroke="rgba(129,140,248,0.15)"/>
  <rect x="88" y="108" width="108" height="6" rx="1" fill="rgba(99,102,241,0.12)"/>
  <rect x="88" y="118" width="80" height="4" rx="1" fill="rgba(255,255,255,0.1)"/><rect x="172" y="118" width="24" height="4" rx="1" fill="rgba(34,197,94,0.3)"/>
  <rect x="88" y="126" width="70" height="4" rx="1" fill="rgba(255,255,255,0.08)"/><rect x="172" y="126" width="24" height="4" rx="1" fill="rgba(34,197,94,0.25)"/>
  <rect x="88" y="134" width="85" height="4" rx="1" fill="rgba(255,255,255,0.08)"/><rect x="172" y="134" width="24" height="4" rx="1" fill="rgba(245,158,11,0.3)"/>
  <rect x="88" y="142" width="75" height="4" rx="1" fill="rgba(255,255,255,0.08)"/><rect x="172" y="142" width="24" height="4" rx="1" fill="rgba(34,197,94,0.25)"/>
  <rect x="88" y="150" width="90" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="88" y="158" width="65" height="4" rx="1" fill="rgba(255,255,255,0.06)"/>
  <!-- ticket queue -->
  <rect x="212" y="90" width="76" height="52" rx="3" fill="rgba(15,23,42,0.7)" stroke="rgba(129,140,248,0.2)"/>
  <text x="218" y="100" fill="rgba(129,140,248,0.7)" font-size="4.5" font-weight="600" font-family="ui-monospace,monospace">TICKET QUEUE</text>
  <rect x="218" y="106" width="64" height="10" rx="2" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.25)"/>
  <text x="222" y="113" fill="rgba(255,255,255,0.5)" font-size="4" font-family="ui-monospace,monospace">#1042 VPN</text>
  <rect x="218" y="120" width="64" height="10" rx="2" fill="rgba(255,255,255,0.04)" stroke="rgba(129,140,248,0.15)"/>
  <text x="222" y="127" fill="rgba(255,255,255,0.4)" font-size="4" font-family="ui-monospace,monospace">#1041 Printer</text>
  <!-- licensing + activity -->
  <rect x="212" y="148" width="76" height="30" rx="3" fill="rgba(15,23,42,0.7)" stroke="rgba(129,140,248,0.2)"/>
  <text x="218" y="158" fill="rgba(129,140,248,0.7)" font-size="4" font-family="ui-monospace,monospace">LICENSES</text>
  <rect x="218" y="162" width="20" height="10" rx="2" fill="rgba(99,102,241,0.2)"/><rect x="242" y="162" width="20" height="10" rx="2" fill="rgba(99,102,241,0.15)"/><rect x="266" y="162" width="16" height="10" rx="2" fill="rgba(99,102,241,0.1)"/>
</svg>
