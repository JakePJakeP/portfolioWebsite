<svg viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Personal portfolio website mockup">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1929"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pf-hero" x1="50" y1="40" x2="270" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.25"/><stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.15"/><stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </linearGradient>
    <filter id="pf-shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="pf-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="url(#pf-bg)"/>
  <!-- browser -->
  <rect x="28" y="12" width="264" height="176" rx="8" fill="#09090b" stroke="rgba(59,130,246,0.4)" stroke-width="1.2" filter="url(#pf-shadow)"/>
  <rect x="28" y="12" width="264" height="18" rx="8" fill="rgba(59,130,246,0.12)"/>
  <circle cx="40" cy="21" r="2.5" fill="#ff5f57"/><circle cx="48" cy="21" r="2.5" fill="#febc2e"/><circle cx="56" cy="21" r="2.5" fill="#28c840"/>
  <!-- nav -->
  <text x="44" y="38" fill="rgba(255,255,255,0.75)" font-size="5.5" font-weight="600" font-family="system-ui,sans-serif">Jake Pajerski</text>
  <rect x="200" y="30" width="18" height="4" rx="1" fill="rgba(255,255,255,0.15)"/>
  <rect x="222" y="30" width="22" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="248" y="30" width="20" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="272" y="28" width="12" height="8" rx="4" fill="rgba(99,102,241,0.35)"/>
  <!-- hero -->
  <rect x="36" y="44" width="248" height="52" rx="4" fill="url(#pf-hero)"/>
  <circle cx="72" cy="70" r="14" fill="rgba(99,102,241,0.2)" stroke="rgba(129,140,248,0.5)"/>
  <circle cx="72" cy="68" r="8" fill="rgba(129,140,248,0.3)"/>
  <rect x="94" y="58" width="64" height="8" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="94" y="70" width="48" height="5" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="94" y="80" width="32" height="8" rx="4" fill="rgba(99,102,241,0.5)" filter="url(#pf-glow)"/>
  <rect x="130" y="80" width="36" height="8" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(59,130,246,0.3)"/>
  <!-- project cards -->
  <rect x="36" y="102" width="76" height="40" rx="4" fill="rgba(30,41,59,0.8)" stroke="rgba(59,130,246,0.25)" filter="url(#pf-glow)"/>
  <rect x="42" y="108" width="64" height="18" rx="2" fill="rgba(99,102,241,0.15)"/>
  <rect x="42" y="130" width="40" height="4" rx="1" fill="rgba(255,255,255,0.12)"/>
  <rect x="118" y="102" width="76" height="40" rx="4" fill="rgba(30,41,59,0.7)" stroke="rgba(59,130,246,0.2)"/>
  <rect x="124" y="108" width="64" height="18" rx="2" fill="rgba(45,212,191,0.12)"/>
  <rect x="124" y="130" width="36" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="200" y="102" width="76" height="40" rx="4" fill="rgba(30,41,59,0.7)" stroke="rgba(59,130,246,0.2)"/>
  <rect x="206" y="108" width="64" height="18" rx="2" fill="rgba(168,85,247,0.12)"/>
  <rect x="206" y="130" width="44" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  <!-- experience timeline -->
  <rect x="36" y="148" width="248" height="32" rx="4" fill="rgba(15,23,42,0.6)" stroke="rgba(59,130,246,0.15)"/>
  <text x="44" y="158" fill="rgba(59,130,246,0.7)" font-size="4.5" font-weight="600" font-family="ui-monospace,monospace">EXPERIENCE</text>
  <circle cx="52" cy="168" r="3" fill="rgba(99,102,241,0.5)"/>
  <line x1="55" y1="168" x2="100" y2="168" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <rect x="104" y="164" width="48" height="4" rx="1" fill="rgba(255,255,255,0.1)"/>
  <circle cx="160" cy="168" r="3" fill="rgba(99,102,241,0.35)"/>
  <line x1="163" y1="168" x2="200" y2="168" stroke="rgba(59,130,246,0.2)" stroke-width="1"/>
  <rect x="204" y="164" width="40" height="4" rx="1" fill="rgba(255,255,255,0.08)"/>
</svg>
